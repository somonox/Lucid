[package]
name = "lucid"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "Lucid - A powerful CLI tool for DreamHack"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
directories = "5.0"
webbrowser = "1.0"
url = "2.5"
anyhow = "1.0"
colored = "2.1"
zip = "2.2"
